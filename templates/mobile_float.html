<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>象棋AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: transparent;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .float-window {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 20px;
        }

        .compact-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            min-width: 280px;
            max-width: 320px;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }

        .time {
            font-size: 11px;
            opacity: 0.8;
        }

        .suggestion-box {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            min-height: 160px;
        }

        .move-display {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .score-display {
            font-size: 14px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .score-value {
            font-weight: 600;
            font-size: 18px;
        }

        .score-positive { color: #fbbf24; }
        .score-negative { color: #f87171; }
        .score-neutral { color: #e5e7eb; }

        .detail-box {
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .detail-label {
            opacity: 0.8;
        }

        .detail-value {
            font-weight: 600;
        }

        .pv-line {
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
            font-family: monospace;
            overflow-x: auto;
            white-space: nowrap;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:active {
            background: rgba(255,255,255,0.3);
        }

        .btn-small {
            flex: none;
            padding: 8px 12px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .settings-panel {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: none;
        }

        .settings-panel.show {
            display: block;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .setting-input {
            width: 60px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 13px;
            text-align: center;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="float-window">
        <div class="compact-card">
            <div class="header">
                <div class="title">
                    <span class="status-dot" id="statusDot"></span>
                    <span>象棋AI助手</span>
                </div>
                <div class="time" id="currentTime">00:00:00</div>
            </div>

            <div class="suggestion-box" id="suggestionBox">
                <div class="loading">
                    <div class="spinner"></div>
                    等待分析...
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="refreshBtn">🔄 刷新</button>
                <button class="btn btn-secondary" id="multiBtn">📊 候选</button>
                <button class="btn btn-secondary btn-small" id="settingsBtn">⚙️</button>
            </div>

            <div class="settings-panel" id="settingsPanel">
                <div class="setting-item">
                    <span>搜索深度</span>
                    <input type="number" class="setting-input" id="depthInput" value="15" min="5" max="25">
                </div>
                <div class="setting-item">
                    <span>自动刷新</span>
                    <select class="setting-input" id="autoRefresh" style="width: auto;">
                        <option value="0">关闭</option>
                        <option value="3000">3秒</option>
                        <option value="5000" selected>5秒</option>
                        <option value="10000">10秒</option>
                    </select>
                </div>
            </div>

            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <script>
        let autoRefreshTimer = null;
        let isAnalyzing = false;

        // UCI 转中文着法（前端版本）
        function uciToChinese(uci) {
            if (!uci || uci.length < 4) return uci;

            const files = 'abcdefghi';

            const fromFile = files.indexOf(uci[0]);
            const fromRank = parseInt(uci[1]);
            const toFile = files.indexOf(uci[2]);
            const toRank = parseInt(uci[3]);

            if (fromFile === -1 || toFile === -1) return uci;

            // 判断红黑方（0-4 行是红方）
            const isRed = fromRank <= 4;

            // 中文数字
            const chineseNums = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
            const arabicNums = ['１', '２', '３', '４', '５', '６', '７', '８', '９'];

            // 列号转换（红方从右往左，黑方从左往右）
            const fromCol = isRed ? (9 - fromFile) : (fromFile + 1);
            const toCol = isRed ? (9 - toFile) : (toFile + 1);

            // 方向和步数
            let direction = '';
            let steps = '';

            if (fromFile === toFile) {
                // 直线移动
                const rankDiff = Math.abs(toRank - fromRank);
                if ((isRed && toRank < fromRank) || (!isRed && toRank > fromRank)) {
                    direction = '进';
                } else {
                    direction = '退';
                }
                const nums = isRed ? chineseNums : arabicNums;
                steps = nums[rankDiff - 1] || rankDiff;
            } else {
                // 横向移动
                direction = '平';
                const nums = isRed ? chineseNums : arabicNums;
                steps = nums[toCol - 1];
            }

            // 组合着法
            const nums = isRed ? chineseNums : arabicNums;
            const fromColChinese = nums[fromCol - 1];

            return fromColChinese + direction + steps;
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', {hour12: false});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 显示错误
        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 3000);
        }

        // 更新状态指示器
        function updateStatus(online) {
            const dot = document.getElementById('statusDot');
            if (online) {
                dot.classList.remove('offline');
            } else {
                dot.classList.add('offline');
            }
        }

        // 格式化分数
        function formatScore(score) {
            if (typeof score === 'string') {
                return score; // 杀棋
            }
            const val = score / 100;
            return (val > 0 ? '+' : '') + val.toFixed(2);
        }

        // 获取分数颜色类
        function getScoreClass(score) {
            if (typeof score === 'string') return 'score-neutral';
            if (score > 30) return 'score-positive';
            if (score < -30) return 'score-negative';
            return 'score-neutral';
        }

        // 显示多个候选着法
        function displayMultipleMoves(moves) {
            const box = document.getElementById('suggestionBox');

            let html = '<div style="font-size: 16px; font-weight: 600; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px;">多个候选着法</div>';

            moves.forEach((move, index) => {
                const scoreClass = getScoreClass(move.score);
                const scoreText = formatScore(move.score);
                // 前端转换 UCI 为中文
                const moveChinese = uciToChinese(move.move);

                html += `
                    <div class="detail-box" style="margin-bottom: 10px; background: rgba(0,0,0,${0.15 + index * 0.05});">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span style="font-size: 20px; font-weight: 700;">${index + 1}. ${moveChinese}</span>
                            <span class="score-value ${scoreClass}" style="font-size: 16px;">${scoreText}</span>
                        </div>
                        ${move.pv && move.pv.length > 0 ? `
                        <div class="pv-line">
                            ${move.pv.slice(0, 5).join(' ')}
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            box.innerHTML = html;
        }

        // 显示建议（完整版，类似 Web 界面）
        function displaySuggestion(data) {
            const box = document.getElementById('suggestionBox');
            const scoreClass = getScoreClass(data.score);
            const scoreText = formatScore(data.score);

            // 前端转换 UCI 为中文
            const moveUCI = data.best_move || '';
            const moveChinese = uciToChinese(moveUCI) || moveUCI || '无着法';

            // 主要变化
            const pvMoves = data.pv || [];
            const pvDisplay = pvMoves.slice(0, 5).join(' ');

            box.innerHTML = `
                <div class="move-display">${moveChinese}</div>

                <div class="score-display">
                    <span class="detail-label">评估分数</span>
                    <span class="score-value ${scoreClass}">${scoreText}</span>
                </div>

                <div class="detail-box">
                    <div class="detail-row">
                        <span class="detail-label">搜索深度</span>
                        <span class="detail-value">${data.depth} 层</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">参考着法</span>
                        <span class="detail-value" style="font-family: monospace;">${moveUCI}</span>
                    </div>
                    ${pvDisplay ? `
                    <div class="pv-line">
                        <div style="opacity: 0.8; margin-bottom: 4px;">主要变化：</div>
                        ${pvDisplay}
                    </div>
                    ` : ''}
                </div>

                <div class="meta-info">
                    <span>分析时间: ${data.timestamp}</span>
                </div>
            `;
        }

        // 显示加载状态
        function showLoading() {
            const box = document.getElementById('suggestionBox');
            box.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    分析中...
                </div>
            `;
        }

        // 获取多个候选着法
        async function analyzeMultiple() {
            if (isAnalyzing) return;
            isAnalyzing = true;
            showLoading();

            const depth = parseInt(document.getElementById('depthInput').value) || 15;

            try {
                const response = await fetch('/api/multi_moves', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({count: 5, depth: depth})
                });

                const data = await response.json();

                if (data.success && data.moves && data.moves.length > 0) {
                    displayMultipleMoves(data.moves);
                    updateStatus(true);
                } else {
                    showError(data.message || '获取候选着法失败');
                    updateStatus(false);
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
                updateStatus(false);
            } finally {
                isAnalyzing = false;
            }
        }

        // 分析局面
        async function analyze() {
            if (isAnalyzing) return;
            isAnalyzing = true;
            showLoading();

            const depth = parseInt(document.getElementById('depthInput').value) || 15;

            try {
                const response = await fetch('/api/mobile/quick_suggest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({depth: depth})
                });

                const data = await response.json();

                if (data.success) {
                    displaySuggestion(data);
                    updateStatus(true);
                } else {
                    showError(data.message || '分析失败');
                    updateStatus(false);
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
                updateStatus(false);
            } finally {
                isAnalyzing = false;
            }
        }

        // 检查引擎状态
        async function checkStatus() {
            try {
                const response = await fetch('/api/mobile/status');
                const data = await response.json();
                updateStatus(data.engine_ready);
                return data.engine_ready;
            } catch (error) {
                updateStatus(false);
                return false;
            }
        }

        // 设置自动刷新
        function setupAutoRefresh() {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            const interval = parseInt(document.getElementById('autoRefresh').value);
            if (interval > 0) {
                autoRefreshTimer = setInterval(analyze, interval);
            }
        }

        // 事件监听
        document.getElementById('refreshBtn').addEventListener('click', analyze);

        document.getElementById('multiBtn').addEventListener('click', analyzeMultiple);

        document.getElementById('settingsBtn').addEventListener('click', () => {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('show');
        });

        document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);

        // 初始化
        (async function init() {
            // 检查引擎状态
            const ready = await checkStatus();
            if (!ready) {
                showError('引擎未就绪，请先启动引擎');
                return;
            }

            // 首次分析
            analyze();

            // 设置自动刷新
            setupAutoRefresh();
        })();
    </script>
</body>
</html>
