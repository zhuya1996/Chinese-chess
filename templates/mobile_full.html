<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>象棋AI助手 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 8px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 棋盘容器 */
        .board-container {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        #chessBoard {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            border: 2px solid #8b6f47;
            border-radius: 8px;
        }

        /* AI 建议面板 */
        .suggestion-panel {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            color: white;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .move-display {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .score-display {
            font-size: 16px;
            text-align: center;
            margin-bottom: 8px;
        }

        .score-value {
            font-weight: 600;
            font-size: 20px;
        }

        .score-positive { color: #fbbf24; }
        .score-negative { color: #f87171; }
        .score-neutral { color: #e5e7eb; }

        .detail-box {
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            margin-top: 8px;
        }

        /* 控制按钮 */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题栏 -->
        <div class="header">
            <div>
                <span class="status-dot" id="statusDot"></span>
                <span class="title">象棋AI助手 - 完整版</span>
            </div>
            <div style="font-size: 12px;" id="currentTime">00:00:00</div>
        </div>

        <!-- 棋盘 -->
        <div class="board-container">
            <canvas id="chessBoard"></canvas>
        </div>

        <!-- AI 建议 -->
        <div class="suggestion-panel" id="suggestionPanel">
            <div class="suggestion-title">AI 分析建议</div>
            <div id="suggestionBox">
                <div class="loading">
                    <div class="spinner"></div>
                    等待分析...
                </div>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" id="startEngineBtn">🚀 启动引擎</button>
            <button class="btn" id="suggestBtn">💡 获取建议</button>
            <button class="btn" id="applyBtn">✅ 应用建议</button>
            <button class="btn" id="undoBtn">↩️ 撤销</button>
            <button class="btn" id="resetBtn">🔄 重置</button>
            <button class="btn" id="flipBtn">🔃 翻转</button>
        </div>
    </div>

    <script>
        // 这里嵌入简化版的棋盘绘制和交互逻辑
        // 直接调用主页面的 API

        const canvas = document.getElementById('chessBoard');
        const ctx = canvas.getContext('2d');

        let engineReady = false;
        let currentSuggestion = null;
        let boardState = initBoard();
        let moveHistory = [];

        // 初始化棋盘数组
        function initBoard() {
            // 标准开局 FEN 的棋盘表示
            const board = Array(10).fill(null).map(() => Array(9).fill(null));

            // 红方
            board[9][0] = {type: 'r', color: 'red', char: '车'};
            board[9][1] = {type: 'n', color: 'red', char: '马'};
            board[9][2] = {type: 'b', color: 'red', char: '相'};
            board[9][3] = {type: 'a', color: 'red', char: '仕'};
            board[9][4] = {type: 'k', color: 'red', char: '帅'};
            board[9][5] = {type: 'a', color: 'red', char: '仕'};
            board[9][6] = {type: 'b', color: 'red', char: '相'};
            board[9][7] = {type: 'n', color: 'red', char: '马'};
            board[9][8] = {type: 'r', color: 'red', char: '车'};
            board[7][1] = {type: 'c', color: 'red', char: '炮'};
            board[7][7] = {type: 'c', color: 'red', char: '炮'};
            for (let i = 0; i < 9; i += 2) {
                board[6][i] = {type: 'p', color: 'red', char: '兵'};
            }

            // 黑方
            board[0][0] = {type: 'r', color: 'black', char: '车'};
            board[0][1] = {type: 'n', color: 'black', char: '马'};
            board[0][2] = {type: 'b', color: 'black', char: '象'};
            board[0][3] = {type: 'a', color: 'black', char: '士'};
            board[0][4] = {type: 'k', color: 'black', char: '将'};
            board[0][5] = {type: 'a', color: 'black', char: '士'};
            board[0][6] = {type: 'b', color: 'black', char: '象'};
            board[0][7] = {type: 'n', color: 'black', char: '马'};
            board[0][8] = {type: 'r', color: 'black', char: '车'};
            board[2][1] = {type: 'c', color: 'black', char: '炮'};
            board[2][7] = {type: 'c', color: 'black', char: '炮'};
            for (let i = 0; i < 9; i += 2) {
                board[3][i] = {type: 'p', color: 'black', char: '卒'};
            }

            return board;
        }

        // 绘制棋盘
        function drawBoard() {
            const size = Math.min(canvas.parentElement.clientWidth - 30, 400);
            canvas.width = size;
            canvas.height = size * 10 / 9;

            const cellSize = size / 9;
            const padding = cellSize / 2;

            // 背景
            ctx.fillStyle = '#e8d4b5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制线条
            ctx.strokeStyle = '#5a4a35';
            ctx.lineWidth = 1;

            // 横线
            for (let i = 0; i <= 9; i++) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(canvas.width - padding, padding + i * cellSize);
                ctx.stroke();
            }

            // 竖线
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                if (i === 0 || i === 8) {
                    ctx.lineTo(padding + i * cellSize, canvas.height - padding);
                } else {
                    ctx.lineTo(padding + i * cellSize, padding + 4 * cellSize);
                    ctx.moveTo(padding + i * cellSize, padding + 5 * cellSize);
                    ctx.lineTo(padding + i * cellSize, canvas.height - padding);
                }
                ctx.stroke();
            }

            // 绘制棋子
            boardState.forEach((row, rowIdx) => {
                row.forEach((piece, colIdx) => {
                    if (piece) {
                        const x = padding + colIdx * cellSize;
                        const y = padding + rowIdx * cellSize;
                        drawPiece(x, y, piece, cellSize * 0.4);
                    }
                });
            });
        }

        // 绘制棋子
        function drawPiece(x, y, piece, radius) {
            // 圆形背景
            ctx.fillStyle = piece.color === 'red' ? '#dc2626' : '#1f2937';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            // 边框
            ctx.strokeStyle = piece.color === 'red' ? '#991b1b' : '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 文字
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${radius * 1.2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(piece.char, x, y);
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', {hour12: false});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 显示建议
        function displaySuggestion(data) {
            const box = document.getElementById('suggestionBox');
            const moveChinese = data.best_move_chinese || data.best_move || '无着法';
            const scoreText = typeof data.score === 'string' ? data.score :
                             (data.score > 0 ? '+' : '') + (data.score / 100).toFixed(2);
            const scoreClass = data.score > 30 ? 'score-positive' :
                              data.score < -30 ? 'score-negative' : 'score-neutral';

            box.innerHTML = `
                <div class="move-display">${moveChinese}</div>
                <div class="score-display">
                    评估: <span class="score-value ${scoreClass}">${scoreText}</span>
                </div>
                <div class="detail-box">
                    深度: ${data.depth} 层 | 时间: ${data.timestamp}
                </div>
            `;

            currentSuggestion = data.best_move;
        }

        // API 调用
        async function startEngine() {
            try {
                const response = await fetch('/api/start', {method: 'POST'});
                const data = await response.json();
                if (data.success) {
                    engineReady = true;
                    document.getElementById('statusDot').style.background = '#4ade80';
                    alert('引擎已启动！');
                } else {
                    alert('引擎启动失败');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        async function getSuggestion() {
            if (!engineReady) {
                alert('请先启动引擎');
                return;
            }

            try {
                const response = await fetch('/api/mobile/quick_suggest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({depth: 15})
                });
                const data = await response.json();
                if (data.success) {
                    displaySuggestion(data);
                } else {
                    alert('分析失败');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        async function applyMove() {
            if (!currentSuggestion) {
                alert('请先获取建议');
                return;
            }

            try {
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({move: currentSuggestion})
                });
                const data = await response.json();
                if (data.success) {
                    moveHistory.push(currentSuggestion);
                    // 这里应该更新棋盘状态，简化版先不实现
                    alert('已应用着法');
                    getSuggestion(); // 自动获取下一步建议
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        async function undo() {
            try {
                const response = await fetch('/api/undo', {method: 'POST'});
                const data = await response.json();
                if (data.success) {
                    if (moveHistory.length > 0) moveHistory.pop();
                    alert('已撤销');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        async function reset() {
            try {
                const response = await fetch('/api/reset', {method: 'POST'});
                const data = await response.json();
                if (data.success) {
                    boardState = initBoard();
                    moveHistory = [];
                    currentSuggestion = null;
                    drawBoard();
                    alert('已重置');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        // 事件监听
        document.getElementById('startEngineBtn').addEventListener('click', startEngine);
        document.getElementById('suggestBtn').addEventListener('click', getSuggestion);
        document.getElementById('applyBtn').addEventListener('click', applyMove);
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('flipBtn').addEventListener('click', () => {
            boardState.reverse();
            boardState = boardState.map(row => row.reverse());
            drawBoard();
        });

        // 初始化
        window.addEventListener('resize', drawBoard);
        drawBoard();
    </script>
</body>
</html>
