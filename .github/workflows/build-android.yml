name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# 需要 contents:write 才能把 APK 发到 Releases 页面、并把构建状态推回分支
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.5.2 要求 Gradle 8.7+，这里固定 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 签名证书用缓存持久化，保证每次构建出的 APK 签名一致，
      # 这样手机上可以直接覆盖升级，不用卸载重装。
      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: android_app/keystore/release.p12
          key: xiangqi-release-keystore-v1

      - name: Generate keystore (first run only)
        run: |
          mkdir -p android_app/keystore
          if [ ! -f android_app/keystore/release.p12 ]; then
            echo "未找到缓存的证书，正在生成新的自签名证书..."
            keytool -genkeypair -v \
              -keystore android_app/keystore/release.p12 \
              -storetype PKCS12 \
              -storepass xiangqi2026 \
              -keypass xiangqi2026 \
              -alias xiangqi \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Xiangqi Overlay, OU=Personal, O=Personal, L=Beijing, ST=Beijing, C=CN"
          else
            echo "已复用缓存中的证书，签名保持一致。"
          fi

      - name: Verify engine resources are present
        run: |
          echo "=== 引擎二进制 ==="
          ls -lh android_app/app/src/main/jniLibs/arm64-v8a/
          echo "=== 神经网络 ==="
          ls -lh android_app/app/src/main/assets/
          if [ ! -f android_app/app/src/main/jniLibs/arm64-v8a/libpikafish.so ]; then
            echo "错误：缺少引擎二进制 libpikafish.so"; exit 1
          fi
          if [ ! -f android_app/app/src/main/assets/pikafish.nnue ]; then
            echo "错误：缺少神经网络 pikafish.nnue"; exit 1
          fi

      # set -o pipefail + tee：既能实时看到输出，又把完整日志留到文件里，
      # 失败时由最后一步推回仓库，方便在没有 GitHub 网页访问的环境下定位。
      - name: Build release APK
        run: |
          set -o pipefail
          cd android_app
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../ci-build.log

      - name: Build debug APK (备用)
        run: |
          set -o pipefail
          cd android_app
          gradle :app:assembleDebug --no-daemon 2>&1 | tee -a ../ci-build.log

      - name: Collect and rename APKs
        run: |
          mkdir -p out
          find android_app/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
          REL=$(find android_app/app/build/outputs/apk/release -name "*.apk" | head -1)
          DBG=$(find android_app/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$REL" out/xiangqi-overlay-release.apk
          cp "$DBG" out/xiangqi-overlay-debug.apk
          echo "=== 产出 ==="
          ls -lh out/
          APK=out/xiangqi-overlay-release.apk
          if command -v apksigner >/dev/null 2>&1; then
            echo "=== 签名校验 ===" | tee -a ../ci-build.log
            apksigner verify --print-certs "$APK" 2>&1 | head -10 | tee -a ../ci-build.log
          else
            echo "=== 未找到 apksigner，改用 keytool ===" | tee -a ../ci-build.log
          fi
          # 记录签名指纹：若各次构建的指纹变了，说明签名证书被重新生成过，
          # 这种包在手机上会因签名不一致而装不上（旧版原地不动 → 用户以为没更新）。
          # 两种取法依次尝试，避免工具缺失导致这一项变空。
          FP=$(apksigner verify --print-certs "$APK" 2>/dev/null \
               | grep -i "SHA-256 digest" | head -1 | sed -E 's/.*:[[:space:]]*//' | tr -d '\r')
          if [ -z "$FP" ]; then
            FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
                 | grep -i "SHA256:" | head -1 | sed -E 's/.*:[[:space:]]*//' | tr -d '\r')
          fi
          echo "SIGN_SHA256=$FP" >> $GITHUB_ENV
          echo "APK 签名指纹：${FP:-（未能取得，检查上面的签名校验输出）}" | tee -a ../ci-build.log

      - name: Read app version
        run: |
          V=$(grep -m1 'versionName' android_app/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          C=$(grep -m1 'versionCode' android_app/app/build.gradle | sed -E 's/[^0-9]//g')
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$C" >> $GITHUB_ENV
          echo "检测到 App 版本：$V (versionCode $C)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-overlay-apk
          path: out/*.apk
          retention-days: 90

      # 先彻底删掉固定标签的旧 Release（含资产），再重建。
      # 不依赖上传组件是否覆盖同名资产 —— 这是「下载下来的还是旧版」的最硬保险。
      - name: Delete stale fixed-tag release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag --repo "${{ github.repository }}" \
            && echo "已删除旧的 apk-latest Release（含旧资产）" \
            || echo "没有旧的 apk-latest Release，跳过"

      # ---- 发布到 Releases ----
      # 固定标签 apk-latest：方便老文档/老链接继续可用。
      # 注意：这个标签是「同一个 Release 反复覆盖资产」，某些情况下
      # 手机端/CDN 会因为 URL 完全没变而拿到旧包，所以它只做兜底。
      - name: Publish to Releases (fixed tag apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 象棋悬浮窗助手 - 最新构建
          make_latest: 'false'
          body: |
            ## 中国象棋悬浮窗助手

            构建版本：`${{ github.sha }}`
            App 版本号：**v${{ env.APP_VERSION }}**（versionCode ${{ env.APP_VERSION_CODE }}）
            签名指纹（SHA-256）：`${{ env.SIGN_SHA256 }}`

            > 这个固定标签会一直覆盖同一个 Release。若你发现下载到的还是旧版，
            > 请改从 `v${{ env.APP_VERSION }}` 标签下载（每个版本一个全新链接，绝不会拿到旧包）。

            ### 下载哪个？
            - **xiangqi-overlay-release.apk** —— 正式版（推荐，装这个）
            - **xiangqi-overlay-debug.apk** —— 调试版（正式版装不上时再用）

            ### 安装步骤
            1. 手机浏览器打开本页面，点上面的 APK 下载
            2. 提示"未知来源"时选择允许
            3. 安装后打开 App，**首屏会显示当前版本号**，先确认版本对得上
            4. 按引导依次开启：悬浮窗权限、截屏权限
            5. 进象棋 App 开一局新棋，悬浮窗会自动识别棋盘（无需手动标定）

            ### 系统要求
            - Android 10（API 29）及以上
            - 手机 CPU 需为 arm64（2017 年之后的机型基本都是）
          files: |
            out/xiangqi-overlay-release.apk
            out/xiangqi-overlay-debug.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 每个版本一个独立标签：URL 全新，手机端不可能命中旧缓存，
      # 用户也不会再遇到「下载下来还是上一版」。
      - name: Publish to Releases (version tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 象棋悬浮窗助手 v${{ env.APP_VERSION }}
          make_latest: 'true'
          body: |
            ## 中国象棋悬浮窗助手 v${{ env.APP_VERSION }}

            构建版本：`${{ github.sha }}`
            versionCode：${{ env.APP_VERSION_CODE }}
            签名指纹（SHA-256）：`${{ env.SIGN_SHA256 }}`

            ### 下载
            - **xiangqi-overlay-release.apk** —— 正式版（推荐）

            装好后打开 App，**首屏会直接显示「当前版本：${{ env.APP_VERSION }}」**，
            与这里对得上就说明装的是这一版。

            ### 系统要求
            - Android 10（API 29）及以上，CPU arm64
          files: |
            out/xiangqi-overlay-release.apk
            out/xiangqi-overlay-debug.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 无论成功失败，都把结论 + 关键错误行推回 ci-status 分支。
      # 这样在没有 GitHub 网页/API 访问的环境里，用 git 就能读到构建结果。
      - name: Report build status back to repo (remote diagnosis)
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci
          {
            echo "# 构建状态"
            echo ""
            echo "- job_status: ${{ job.status }}"
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_attempt: ${{ github.run_attempt }}"
            echo "- sha: ${{ github.sha }}"
            echo "- app_version: ${{ env.APP_VERSION }} (${{ env.APP_VERSION_CODE }})"
            echo "- apk_signature_sha256: ${{ env.SIGN_SHA256 }}"
            echo "- ref: ${{ github.ref }}"
            echo "- time_utc: $(date -u +%FT%TZ)"
            echo ""
            echo '## 关键错误行'
            echo '```'
            if [ -f ci-build.log ]; then
              grep -nE "error:|错误|FAILURE:|FAILED|What went wrong|Caused by:|BUILD FAILED|Execution failed for|Unresolved reference|incompatible types|missing return|symbol:|location:|Could not (resolve|find|determine)" ci-build.log | head -250
            else
              echo "(未生成 gradle 日志 —— 失败发生在编译之前的步骤)"
            fi
            echo '```'
            echo ""
            echo '## 日志末尾 200 行'
            echo '```'
            if [ -f ci-build.log ]; then tail -200 ci-build.log; fi
            echo '```'
            echo ""
            echo '## Releases 资产实况（用来确认资产有没有真的被替换）'
            echo '```'
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=6" \
              | jq -r '.[] | "tag=\(.tag_name) | assets=" + ([.assets[] | "\(.name) \(.size)B up=\(.updated_at)"] | join(" ; "))' 2>&1 | head -12
            echo '```'
            echo ""
            echo '## 关键文件是否存在'
            echo '```'
            ls -lh android_app/app/src/main/jniLibs/arm64-v8a/ 2>&1
            ls -lh android_app/app/src/main/assets/ 2>&1
            ls -lh out/ 2>&1
            echo '```'
          } > ci/LAST_STATUS.md
          wc -c ci/LAST_STATUS.md

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-status
          git add -f ci/LAST_STATUS.md
          git commit -m "ci: 构建状态 ${{ job.status }} (${{ github.sha }}) [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-status
