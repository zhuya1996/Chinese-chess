name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用固定版本避免迁移问题

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make build script executable
        run: chmod +x build-apk.sh

      - name: Build APKs
        run: ./build-apk.sh

      - name: List generated APK files
        run: |
          echo "=== Listing APK files ==="
          find android_app/app/build/outputs/apk -name "*.apk" -type f || echo "No APK files found"
          echo "=== Debug directory ==="
          ls -lh android_app/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug directory not found"
          echo "=== Release directory ==="
          ls -lh android_app/app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory not found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android_app/app/build/outputs/apk/debug/*.apk
            android_app/app/build/outputs/apk/release/*.apk
          body: |
            ## 📱 中国象棋 AI 助手 - Android App

            ### 下载说明
            - **app-debug.apk**: 测试版（推荐普通用户）
            - **app-release-unsigned.apk**: 发布版（未签名）

            ### 安装步骤
            1. 下载 `app-debug.apk`
            2. 手机上允许"安装未知来源应用"
            3. 打开 APK 安装
            4. 启动后配置服务器地址（见使用指南）

            ### 使用前提
            - 电脑运行后台服务（web_assistant.py）
            - 手机与电脑连接同一 WiFi
            - 允许悬浮窗权限

            更多信息请参阅 [云端下载APK使用指南.md](https://github.com/${{ github.repository }}/blob/master/云端下载APK使用指南.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
