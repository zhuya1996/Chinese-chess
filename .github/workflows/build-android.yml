name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Generate Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: |
          cd android_app
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            ## 📱 中国象棋 AI 助手 - Android App

            ### 下载说明
            - **app-debug.apk**: 测试版（推荐普通用户）
            - **app-release-unsigned.apk**: 发布版（未签名）

            ### 安装步骤
            1. 下载 `app-debug.apk`
            2. 手机上允许"安装未知来源应用"
            3. 打开 APK 安装
            4. 启动后配置服务器地址（见使用指南）

            ### 使用前提
            - 电脑运行后台服务（web_assistant.py）
            - 手机与电脑连接同一 WiFi
            - 允许悬浮窗权限

            更多信息请参阅 [云端下载APK使用指南.md](https://github.com/${{ github.repository }}/blob/master/云端下载APK使用指南.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
